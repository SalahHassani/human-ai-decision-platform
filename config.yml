experiment:
  rounds: 2
  discussion_duration_seconds: 60

conditions:
  condition_1:
    name: "Three Humans"
    participants:
      - { id: player_a, type: human }
      - { id: player_b, type: human }
      - { id: player_c, type: human }

  condition_2:
    name: "Two Humans and One AI"
    participants:
      - { id: player_a, type: human }
      - { id: player_b, type: human }
      - { id: player_c, type: ai, provider: rule_based, model: deterministic-v1 }

  condition_3:
    name: "One Human and Two AI"
    participants:
      - { id: player_a, type: human }
      - { id: player_b, type: ai, provider: rule_based, model: deterministic-v1 }
      - { id: player_c, type: ai, provider: rule_based, model: deterministic-v1 }

ai:
  enabled: true
  real_ai: false
  provider: "rule_based"
  model: "deterministic-v1"
  min_response_delay_seconds: 4
  max_response_delay_seconds: 14
  max_messages_per_round: 2
  participants:
    ai_1:
      enabled: true
      provider: "gemini"
      model: "gemini-3.8-flash"
      api_key_env: "AI_1_API_KEY"
      personality: "analytical"
    ai_2:
      enabled: true
      provider: "gemini"
      model: "gemini-3.8-flash"
      api_key_env: "AI_2_API_KEY"
      personality: "cooperative"
  fallback:
    enabled: true
    engine: "rule_based"
    timeout_seconds: 30.0
    retry_attempts: 1
    switch_for_remainder_of_session: true

voting:
  allow_self_vote: false
  tie_break: [round_2_votes, alphabetical_order]